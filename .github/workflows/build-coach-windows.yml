name: Build Coach (Windows installer)

# Builds the "En Croissant Coach" Windows installer and publishes it on this
# repository's Releases page. Runs on every push to the `coach` branch, or
# manually from the Actions tab ("Run workflow").
on:
  push:
    branches: [coach]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build installer and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AIX_EXTENSION_TARGET: windows_amd64
          AIX_EXTENSION_FORCE_DOWNLOAD: "1"
          CI: false
        with:
          tagName: coach-build-${{ github.run_number }}
          releaseName: "En Croissant Coach — build ${{ github.run_number }}"
          releaseBody: "Download the `_x64-setup.exe` below and run it. Windows may show a SmartScreen warning because the app isn't code-signed: click **More info → Run anyway**."
          releaseDraft: false
          prerelease: true
          args: "--bundles nsis"
